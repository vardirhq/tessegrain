[package]
name = "tessegrain"
version = "0.1.0"
edition = "2021"
description = "Experimental agent-oriented pixel art tools"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
